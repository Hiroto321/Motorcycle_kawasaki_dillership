<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Financing</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/service_pages.css') }}">
</head>
<body>
    <div class="wrapper">
        <header class="container">
            <span class="logo">KAWASAKI</span>
            <nav>
                <ul>
                    <li><a href="{{ url_for('index') }}">Home</a></li>
                    <li><a href="{{ url_for('motorcycles_page') }}">Motorcycles</a></li>
                    <li><a href="{{ url_for('cart_page') }}">Cart</a></li>
                    <li><a href="{{ url_for('contact_page') }}">Contact us</a></li>
                    <li class="btn"><a href="{{ url_for('login_page') }}">Log in</a></li>
                </ul>
            </nav>
        </header>

        <main class="service-page container">
            <div class="page-header">
                <h1>Financing Options</h1>
                <p>Flexible financing solutions to get you on the road</p>
            </div>

            <div class="financing-calculator">
                <h2>Loan Calculator</h2>
                <div class="calculator-form">
                    <div class="calc-field">
                        <label>Vehicle Price ($)</label>
                        <input type="number" id="vehiclePrice" placeholder="Enter price" value="10000">
                    </div>
                    <div class="calc-field">
                        <label>Down Payment ($)</label>
                        <input type="number" id="downPayment" placeholder="Down payment" value="2000">
                    </div>
                    <div class="calc-field">
                        <label>Interest Rate (%)</label>
                        <input type="number" id="interestRate" placeholder="Interest rate" value="5.9" step="0.1">
                    </div>
                    <div class="calc-field">
                        <label>Loan Term (months)</label>
                        <select id="loanTerm">
                            <option value="12">12 months</option>
                            <option value="24">24 months</option>
                            <option value="36" selected>36 months</option>
                            <option value="48">48 months</option>
                            <option value="60">60 months</option>
                        </select>
                    </div>
                    <button class="btn" onclick="calculatePayment()">Calculate Payment</button>
                </div>
                <div class="calc-result" id="calcResult">
                    <p>Monthly Payment: <strong>$0</strong></p>
                </div>
            </div>
        </main>
    </div>

    <footer>
        <div class="footer-container">
            <div class="footer-links">
                <div class="footer-column">
                    <h4>Support</h4>
                    <ul>
                        <li><a href="{{ url_for('financing_page') }}">Financing</a></li>
                    </ul>
                </div>
            </div>
        </div>
    </footer>

    <!-- Скрипт для калькулятора -->
    <script>
        function calculatePayment() {
            let price = parseFloat(document.getElementById('vehiclePrice').value);
            let down = parseFloat(document.getElementById('downPayment').value);
            let rate = parseFloat(document.getElementById('interestRate').value) / 100 / 12;
            let months = parseInt(document.getElementById('loanTerm').value);
            
            let loanAmount = price - down;
            if (loanAmount <= 0) {
                document.getElementById('calcResult').innerHTML = '<p>Monthly Payment: <strong>$0</strong></p>';
                return;
            }
            
            let payment = loanAmount * rate * Math.pow(1 + rate, months) / (Math.pow(1 + rate, months) - 1);
            document.getElementById('calcResult').innerHTML = '<p>Monthly Payment: <strong>$' + payment.toFixed(2) + '</strong></p>';
        }
    </script>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
